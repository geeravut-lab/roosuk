<!doctype html>
<html lang="th">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>ออฟไลน์ | RooSuk</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        box-sizing: border-box;
        background: #f7fbfa;
        color: #1f2a30;
        font-family:
          system-ui,
          -apple-system,
          "Noto Sans Thai",
          sans-serif;
        text-align: center;
      }
      main {
        max-width: 22rem;
      }
      img {
        width: 72px;
        height: 72px;
        border-radius: 16px;
      }
      h1 {
        font-size: 1.4rem;
        color: #07707f;
        margin: 1rem 0 0.5rem;
      }
      p {
        line-height: 1.6;
        margin: 0.4rem 0;
      }
      button {
        margin-top: 1.25rem;
        min-height: 48px;
        padding: 0 1.5rem;
        border: 0;
        border-radius: 12px;
        background: #0a8fa3;
        color: #fff;
        font: inherit;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon-192.png" alt="" />
      <h1>ไม่มีสัญญาณอินเทอร์เน็ต</h1>
      <p>
        รู้สุขต้องใช้อินเทอร์เน็ตเพื่อแสดงข้อมูลสุขภาพของคุณอย่างปลอดภัย
        กรุณาเชื่อมต่อแล้วลองใหม่
      </p>
      <p lang="en">
        You are offline. RooSuk needs a connection to show your health data
        securely. Please reconnect and try again.
      </p>
      <button type="button" onclick="location.reload()">
        ลองใหม่ / Try again
      </button>
    </main>
  </body>
</html>
